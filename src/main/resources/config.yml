# ======================================================================
#  GalacticMace - config.yml
#  Vanilla-1.21-style Mace, Wind Charge, Netherite gear, and their
#  enchantments, backported to Spigot 1.12.2.
# ======================================================================

resource-pack:
  url: "https://example.com/path/to/resource-pack.zip"
  sha1: ""
  decline-message: "&eYou declined the resource pack - custom items will use their vanilla look."
  prompt-on-join: true

mace:
  base-damage: 6.0
  smash-crit-multiplier: 1.5
  knockback-strength: 1.2

wind-charge:
  speed: 2.2
  gravity: false
  lifetime-ticks: 100
  cooldown-ticks: 8
  radius: 4.0
  knockback-strength: 1.6
  particles: true
  sounds: true

enchantments:
  density:
    max-level: 5
    weight: 10
    damage-per-level: 0.5
  breach:
    max-level: 4
    weight: 5
    armor-ignore-per-level: 0.15
  wind-burst:
    max-level: 3
    weight: 5
    launch-per-level: 0.55
  bundle-chance-multiplier: 0.75
  anvil:
    cost-per-level: 2
  loot:
    enabled: false
    chance: 0.08

netherite:
  toughness-per-piece: 3.0
  knockback-resistance-per-piece: 0.1
  helmet:
    armor: 4
    durability: 1024
  chestplate:
    armor: 9
    durability: 1024
  leggings:
    armor: 7
    durability: 1024
  boots:
    armor: 4
    durability: 1024
  sword:
    attack-damage: 8.0
    durability: 2048
  pickaxe:
    attack-damage: 6.0
    durability: 2048
  axe:
    attack-damage: 10.0
    durability: 2048
  shovel:
    attack-damage: 6.5
    durability: 2048
  hoe:
    durability: 2048

recipes:
  mace:
    enabled: true
    type: shaped
    result: mace
    shape:
      - "EWE"
      - "WDW"
      - "EWE"
    ingredients:
      E: ELYTRA
      W: wind_charge
      D: DRAGON_EGG
  wind_charge:
    enabled: true
    type: shapeless
    result: wind_charge
    result-amount: 8
    ingredients:
      - ENDER_PEARL
      - SNOWBALL
  netherite_ingot:
    enabled: false
  netherite_helmet:
    enabled: true
    type: shaped
    result: netherite_helmet
    shape:
      - "DDD"
      - "D D"
    ingredients:
      D: DIAMOND_HELMET
  netherite_chestplate:
    enabled: true
    type: shaped
    result: netherite_chestplate
    shape:
      - "D D"
      - "DDD"
      - "DDD"
    ingredients:
      D: DIAMOND_CHESTPLATE
  netherite_leggings:
    enabled: true
    type: shaped
    result: netherite_leggings
    shape:
      - "DDD"
      - "D D"
      - "D D"
    ingredients:
      D: DIAMOND_LEGGINGS
  netherite_boots:
    enabled: true
    type: shaped
    result: netherite_boots
    shape:
      - "D D"
      - "D D"
    ingredients:
      D: DIAMOND_BOOTS
  netherite_sword:
    enabled: true
    type: shaped
    result: netherite_sword
    shape:
      - "D"
      - "D"
      - "S"
    ingredients:
      D: DIAMOND_SWORD
      S: STICK
  netherite_pickaxe:
    enabled: true
    type: shaped
    result: netherite_pickaxe
    shape:
      - "DDD"
      - " S "
      - " S "
    ingredients:
      D: DIAMOND_PICKAXE
      S: STICK
  netherite_axe:
    enabled: true
    type: shaped
    result: netherite_axe
    shape:
      - "DD"
      - "DS"
      - " S"
    ingredients:
      D: DIAMOND_AXE
      S: STICK
  netherite_shovel:
    enabled: true
    type: shaped
    result: netherite_shovel
    shape:
      - "D"
      - "S"
      - "S"
    ingredients:
      D: DIAMOND_SPADE
      S: STICK
  netherite_hoe:
    enabled: true
    type: shaped
    result: netherite_hoe
    shape:
      - "DD"
      - " S"
      - " S"
    ingredients:
      D: DIAMOND_HOE
      S: STICK
